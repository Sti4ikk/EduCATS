name: build

on: [ workflow_dispatch, pull_request ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Holds the Codecov token (as in the previous workflow).
    environment: github-actions-release
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The shared project uses MAUI (UseMaui=true), the Android workload brings the MAUI SDK.
      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: NuGet Cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Unit-Tests + Coverlet
        run: |
          rm -rf "$COVERAGE_DIRECTORY"
          mkdir -p "$COVERAGE_DIRECTORY"
          COVERAGE_OUTPUT_DIRECTORY="$(pwd)/$COVERAGE_DIRECTORY"
          dotnet --info
          dotnet test $PROJECT_PATH \
            --logger "trx;LogFileName=test-results.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutput="$COVERAGE_OUTPUT_DIRECTORY/" \
            /p:CoverletOutputFormat=lcov \
            --results-directory:"$COVERAGE_DIRECTORY"
        env:
          PROJECT_PATH: ./source/EduCATS.UnitTests/EduCATS.UnitTests.csproj
          COVERAGE_DIRECTORY: ./coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./coverage/**/*.trx

      - name: Codecov Deploy
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5.4.3
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/**/*.info

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: NuGet Cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build ./source/EduCATS.MAUI/EduCATS.MAUI.csproj -f net10.0-android -c Release

  build-ios:
    name: Build (iOS simulator)
    runs-on: macos-latest
    needs: test
    # Depends on the Xcode version of the runner image matching the iOS workload.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Build
        run: >
          dotnet build ./source/EduCATS.MAUI/EduCATS.MAUI.csproj
          -f net10.0-ios -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:EnableCodeSigning=false
